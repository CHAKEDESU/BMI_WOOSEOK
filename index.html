<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 계산기 | Health Check</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="calculator-container">
    <div class="eyebrow">HEALTH CHECK</div>
    <h1>BMI 계산기</h1>
    <p class="subtitle">키와 몸무게를 입력하고 나의 체질량지수를 확인해 보세요.</p>

    <form id="bmi-form">
      <div class="input-group">
        <label for="height">키</label>
        <div class="input-field">
          <input type="number" id="height" placeholder="예: 170" min="1" step="any" required>
          <span class="unit">cm</span>
        </div>
      </div>
      <div class="input-group">
        <label for="weight">몸무게</label>
        <div class="input-field">
          <input type="number" id="weight" placeholder="예: 70" min="0.1" step="any" required>
          <span class="unit">kg</span>
        </div>
      </div>
      <button type="submit">계산하기</button>
    </form>

    <section class="result-container is-hidden" id="result-panel" aria-live="polite">
      <p class="result-label">나의 체질량지수</p>
      <h2 id="result"></h2>
      <span id="state" class="status-badge"></span>
      <p id="comment" class="result-comment"></p>
    </section>

    <section class="bmi-result-box" aria-label="BMI 판정 구간">
      <div class="section-heading">BMI 판정 기준</div>
      <div class="bmi-bar-wrap">
        <div class="bmi-pointer" id="bmiPointer"></div>
        <div class="bmi-bar">
          <div class="bmi-segment under">저체중</div>
          <div class="bmi-segment normal">정상</div>
          <div class="bmi-segment over">과체중</div>
          <div class="bmi-segment obese">비만</div>
        </div>
        <div class="bmi-scale">
          <span>18.5</span><span>23</span><span>25</span>
        </div>
      </div>
      <p class="note">BMI는 건강 상태를 확인하는 참고 지표예요.</p>
    </section>
  </main>
</body>
</html>
